[package]
name = "pi-jobs"
version = "0.2.0"
edition = "2024"
description = "Pueue-backed background jobs and completion watches for Pi"
license = "MIT"

[dependencies]
pueue-lib = { version = "0.31", default-features = false, features = ["network_blocking", "settings"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
lexopt = "0.3"
getrandom = { version = "0.3", features = ["std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
